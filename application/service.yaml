apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shajahan-devops1/argocd.git
    targetRevision: main
    path: service
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
